[project]
name = "addonfactory-workflow-addon-release"
version = "0.0.0"
description = "Development tooling for the reusable add-on build and release workflow"
requires-python = ">=3.9,<3.14"
dependencies = [
  "pyyaml==6.0.3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "8.4.2"
pytest-cov = "7.1.0"
ruff = "0.14.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "--cov=.",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
]

[tool.coverage.run]
relative_files = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
