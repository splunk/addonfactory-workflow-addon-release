name: Run RFCT on WFE
description: Submit and collect an isolated RFCT comparison through the WFE Argo API
inputs:
  request-path:
    description: Absolute path to the validated RFCT request with frozen package/source references
    required: true
  request-url:
    description: Run-scoped S3 object URL where this action stages the request
    required: true
  manifests-ref:
    description: Reviewed immutable commit SHA of ta-automation-k8s-manifests
    required: true
  argo-template:
    description: Installed RFCT WorkflowTemplate name
    required: false
    default: rfct-comparison
  namespace:
    description: Argo workflow namespace
    required: false
    default: workflows
  output-directory:
    description: Absolute empty directory for downloaded cluster evidence
    required: true
  timeout-seconds:
    description: Maximum time to wait before requesting graceful server-side cancellation
    required: false
    default: "3600"
outputs:
  workflow-name:
    description: Submitted Argo workflow name
    value: ${{ steps.invoke.outputs.workflow-name }}
  workflow-uid:
    description: Argo workflow UID used to scope and verify outputs
    value: ${{ steps.invoke.outputs.workflow-uid }}
  status:
    description: Comparison outcome, changes, no-changes, or failed; running is checkpointed while waiting
    value: ${{ steps.invoke.outputs.status }}
  candidate-version:
    description: Frozen candidate package version
    value: ${{ steps.invoke.outputs.candidate-version }}
  image-digest:
    description: Digest of the requested RFCT image
    value: ${{ steps.invoke.outputs.image-digest }}
  execution-result-path:
    description: Path to downloaded execution.json
    value: ${{ steps.invoke.outputs.execution-result-path }}
  result-path:
    description: Path to the validated cluster result.json
    value: ${{ steps.invoke.outputs.result-path }}
  artifact-directory:
    description: Downloaded comparison, documentation, and sanitized diagnostics
    value: ${{ steps.invoke.outputs.artifact-directory }}
runs:
  using: composite
  steps:
    - name: Submit and collect RFCT Argo workflow
      id: invoke
      shell: sh
      env:
        INPUT_REQUEST_PATH: ${{ inputs.request-path }}
        INPUT_REQUEST_URL: ${{ inputs.request-url }}
        INPUT_MANIFESTS_REF: ${{ inputs.manifests-ref }}
        INPUT_ARGO_TEMPLATE: ${{ inputs.argo-template }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: python3 "$GITHUB_ACTION_PATH/run_rfct.py"
