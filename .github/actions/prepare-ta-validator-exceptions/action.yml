name: Prepare TA Validator exceptions
description: Find or create the TA Validator exception comment and transport it
inputs:
  token:
    required: true
  repository:
    required: true
  pull_request_number:
    required: true
  comment_author:
    required: true
  output_path:
    required: true
outputs:
  comment-reference:
    description: URL of the selected TA Validator exception comment
    value: ${{ steps.write-exception-document.outputs.comment-reference }}
runs:
  using: composite
  steps:
    - name: Find TA Validator exception comment
      id: find-comment
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
      with:
        token: ${{ inputs.token }}
        repository: ${{ inputs.repository }}
        issue-number: ${{ inputs.pull_request_number }}
        comment-author: ${{ inputs.comment_author }}
        body-includes: "<!-- ta-validator-exceptions:v1 -->"
    - name: Write TA Validator exception document
      id: write-exception-document
      shell: sh
      env:
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_COMMENT_ID: ${{ steps.find-comment.outputs.comment-id }}
        INPUT_COMMENT_BODY: ${{ steps.find-comment.outputs.comment-body }}
      run: python3 "$GITHUB_ACTION_PATH/prepare.py"
