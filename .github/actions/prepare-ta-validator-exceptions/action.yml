name: Prepare TA Validator exceptions
description: Create and transport the canonical TA Validator exception comment
inputs:
  token:
    required: true
  repository:
    required: true
  pull_request_number:
    required: true
  output_path:
    required: true
runs:
  using: composite
  steps:
    - name: Prepare TA Validator exception input
      shell: sh
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
      run: python3 "$GITHUB_ACTION_PATH/prepare.py"
