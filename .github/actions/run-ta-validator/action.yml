name: Run TA Validator
description: Run TA Validator validation or evaluation in its published image
inputs:
  image:
    description: Full TA Validator image reference
    required: true
  mode:
    description: Either validate a PR exception input or evaluate the add-on
    required: true
  aws-access-key-id:
    description: AWS access key used to pull the TA Validator image
    required: true
  aws-secret-access-key:
    description: AWS secret key used to pull the TA Validator image
    required: true
  aws-region:
    description: AWS region containing the TA Validator image
    required: true
  pull-request-exceptions-path:
    description: Host path to the canonical PR exception YAML file
    required: false
    default: ""
  pull-request-exception-reference:
    description: GitHub comment URL for the canonical PR exception YAML file
    required: false
    default: ""
  addon-read-only:
    description: Mount the checked-out add-on directory read-only
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Checkout add-on
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Run TA Validator image
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PULL_REQUEST_EXCEPTIONS_PATH: ${{ inputs.pull-request-exceptions-path }}
        INPUT_PULL_REQUEST_EXCEPTION_REFERENCE: ${{ inputs.pull-request-exception-reference }}
        INPUT_ADDON_READ_ONLY: ${{ inputs.addon-read-only }}
      run: |-
        set -euo pipefail

        image="$INPUT_IMAGE"
        mode="$INPUT_MODE"
        pull_request_exceptions_path="$INPUT_PULL_REQUEST_EXCEPTIONS_PATH"
        pull_request_exception_reference="$INPUT_PULL_REQUEST_EXCEPTION_REFERENCE"
        docker_options=(--rm)

        case "$INPUT_ADDON_READ_ONLY" in
          true) docker_options+=(-v "$GITHUB_WORKSPACE:/addon:ro") ;;
          false) docker_options+=(-v "$GITHUB_WORKSPACE:/addon") ;;
          *) echo "addon-read-only must be true or false" >&2; exit 1 ;;
        esac

        if [ -n "$pull_request_exceptions_path" ] || [ -n "$pull_request_exception_reference" ]; then
          if [ -z "$pull_request_exceptions_path" ] || [ -z "$pull_request_exception_reference" ]; then
            echo "pull-request-exceptions-path and pull-request-exception-reference must be supplied together" >&2
            exit 1
          fi
          if [ ! -f "$pull_request_exceptions_path" ]; then
            echo "pull-request-exceptions-path must name an existing file" >&2
            exit 1
          fi
          docker_options+=(-v "$pull_request_exceptions_path:/run/ta-validator-pr-exceptions.yaml:ro")
        fi

        case "$mode" in
          validate)
            if [ -z "$pull_request_exceptions_path" ]; then
              echo "validate mode requires pull-request-exceptions-path and pull-request-exception-reference" >&2
              exit 1
            fi
            command=(validate --repository /addon --pull-request-exceptions /run/ta-validator-pr-exceptions.yaml --pull-request-exception-reference "$pull_request_exception_reference")
            ;;
          evaluate)
            command=()
            docker_options+=(
              -e GITHUB_TOKEN
              -e GITHUB_USERNAME
              -e AWS_ACCESS_KEY_ID
              -e AWS_SECRET_ACCESS_KEY
              -e AWS_DEFAULT_REGION
              -e APPINSPECT_USER
              -e APPINSPECT_PASS
              -e GS_VERSION
            )
            if [ -n "$pull_request_exceptions_path" ]; then
              docker_options+=(
                -e TA_VALIDATOR_PULL_REQUEST_EXCEPTIONS=/run/ta-validator-pr-exceptions.yaml
                -e TA_VALIDATOR_PULL_REQUEST_EXCEPTION_REFERENCE="$pull_request_exception_reference"
              )
            fi
            ;;
          *) echo "mode must be validate or evaluate" >&2; exit 1 ;;
        esac

        docker pull "$image"
        docker run "${docker_options[@]}" "$image" "${command[@]}"
