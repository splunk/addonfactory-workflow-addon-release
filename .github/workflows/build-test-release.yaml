name: "build-test-release"
on:
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: read
  pull-requests: read
  statuses: write

jobs:
  compliance-copyrights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: apache/skywalking-eyes@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  review-secrets:
    name: security-detect-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: "0"
      - name: Trust checkout inside scanner container
        run: |
          mkdir -p "$RUNNER_TEMP/_github_home"
          git config --file "$RUNNER_TEMP/_github_home/.gitconfig" --add safe.directory /github/workspace/.git
      - name: Scan proposed changes for secrets
        uses: edplato/trufflehog-actions-scan@v0.9j-beta

  semgrep:
    uses: splunk/sast-scanning/.github/workflows/sast-scan.yml@main
    secrets:
      SEMGREP_KEY: ${{ secrets.SEMGREP_PUBLISH_TOKEN }}
    with:
      block_mode: "policy"

  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.2.1
      - name: Install repository validation dependencies
        run: poetry install --no-root
      - name: Run repository unit tests with coverage
        run: poetry run pytest
      - name: Upload repository coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: repository-python-coverage
          path: coverage.xml
          if-no-files-found: error
      - run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/ea8102762106cdca9c88829f1295b39a544706f3/scripts/download-actionlint.bash)
      - uses: pre-commit/action@v3.0.1

  ci-gate:
    if: ${{ always() }}
    needs:
      - compliance-copyrights
      - pre-commit
      - review-secrets
      - semgrep
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation jobs
        env:
          COMPLIANCE_RESULT: ${{ needs.compliance-copyrights.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          REVIEW_SECRETS_RESULT: ${{ needs.review-secrets.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          if [[ "$COMPLIANCE_RESULT" != "success" || \
                "$PRE_COMMIT_RESULT" != "success" || \
                "$REVIEW_SECRETS_RESULT" != "success" || \
                "$SEMGREP_RESULT" != "success" ]]; then
            echo "One or more required validation jobs did not succeed."
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs:
      - compliance-copyrights
      - pre-commit
      - review-secrets
      - semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Semantic Release
        uses: splunk/semantic-release-action@v1.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          git_committer_name: ${{ secrets.SA_GH_USER_NAME }}
          git_committer_email: ${{ secrets.SA_GH_USER_EMAIL }}
          gpg_private_key: ${{ secrets.SA_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.SA_GPG_PASSPHRASE }}

  update-semver:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v7.0.1
      - uses: splunk/addonfactory-update-semver@v1.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          git_committer_name: ${{ secrets.SA_GH_USER_NAME }}
          git_committer_email: ${{ secrets.SA_GH_USER_EMAIL }}
          gpg_private_key: ${{ secrets.SA_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.SA_GPG_PASSPHRASE }}
