name: "build-test-release"
on:
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: read
  pull-requests: read
  statuses: write

jobs:
  compliance-copyrights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: apache/skywalking-eyes@cd7b195c51fd3d6ad52afceb760719ddc6b3ee91 # v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  review-secrets:
    name: security-detect-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: "0"
      - name: Scan proposed changes for verified secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          extra_args: --json --only-verified
          version: 3.77.0

  semgrep:
    uses: splunk/sast-scanning/.github/workflows/sast-scan.yml@d6beb6dd139a71e87419f963852c53bf0efc94e7 # main
    secrets:
      SEMGREP_KEY: ${{ secrets.SEMGREP_PUBLISH_TOKEN }}
    with:
      block_mode: "policy"

  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.2.1
      - name: Install repository validation dependencies
        run: poetry install --no-root
      - name: Run repository unit tests with coverage
        run: poetry run pytest
      - name: Upload repository coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-python-coverage
          path: coverage.xml
          if-no-files-found: error
      - run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/ea8102762106cdca9c88829f1295b39a544706f3/scripts/download-actionlint.bash)
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      - name: Run CI-only workflow hygiene hook
        run: pre-commit run workflow-hygiene --hook-stage manual --all-files
      - name: Mint token to read addonfactory-repository-template
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: splunk
          repositories: addonfactory-repository-template
      - name: Run CI-only template compatibility hook
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pre-commit run template-compat --hook-stage manual --all-files

  publish:
    needs:
      - compliance-copyrights
      - pre-commit
      - review-secrets
      - semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          persist-credentials: false
      - name: Semantic Release
        uses: splunk/semantic-release-action@e51b04598818ef90688922ea2153fa99452eddf1 # v1.3
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          git_committer_name: ${{ secrets.SA_GH_USER_NAME }}
          git_committer_email: ${{ secrets.SA_GH_USER_EMAIL }}
          gpg_private_key: ${{ secrets.SA_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.SA_GPG_PASSPHRASE }}

  update-semver:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: splunk/addonfactory-update-semver@da0301a1da3d66f2358d8d865d7475d248fee2d1 # v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          git_committer_name: ${{ secrets.SA_GH_USER_NAME }}
          git_committer_email: ${{ secrets.SA_GH_USER_EMAIL }}
          gpg_private_key: ${{ secrets.SA_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.SA_GPG_PASSPHRASE }}
